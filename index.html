      }

      a,
      button,
      input[type="range"],
      .clickable,
      .color-dot,
      .top-btn,
      .game-modal-close,
      .avatar-preview-close,
      .spotify-center-logo,
      .social-pill a,
      .mmb-btn,
      .settings-slider,

        cursor: var(--cursor-pointer) !important;
      }

      /* Canvas dải lụa neon */
      .neon-ribbon-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none !important;
        z-index: 99998;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
      }

      img,
      video,
      canvas {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
        pointer-events: none !important;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background-color: #0a0a12;
        color: var(--text-main);
        overflow-x: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .bg-media {
        position: fixed;
        top: -2%;
        left: -2%;
        width: 104%;
        height: 104%;
        min-width: 104vw;
        min-height: 104vh;
        object-fit: cover;
        object-position: center;
        z-index: -3;
        filter: brightness(0.85);
        transform: scale(1.04);
        pointer-events: none;
      }

      .pc-gif {
        display: block;
      }
      .mobile-gif {
        display: none;
      }

      @media (max-width: 768px) {
        .pc-gif {
          display: none;
        }
        .mobile-gif {
          display: block;
        }
      }

      .ambient-orbs {
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        overflow: hidden;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.35;
        animation: orbFloat 10s ease-in-out infinite alternate;
      }

      .orb-1 {
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, #ff1177, #7928ca);
        top: -100px;
        left: -100px;
      }

      .orb-2 {
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, #0070f3, #00dfd8);
        bottom: -80px;
        right: -80px;
        animation-duration: 12s;
      }

      @keyframes orbFloat {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(40px, 40px) scale(1.1);
        }
      }

      .particles-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        animation: floatUp linear infinite;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }
        20% {
          opacity: 0.8;
        }
        80% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-10vh) scale(1);
          opacity: 0;
        }
      }

      .intro-screen {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 14, 0.94);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0.8s;
      }

      .intro-screen.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .intro-avatar-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      .intro-avatar-wrap::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: conic-gradient(#ff0055, #ff7700, #ffe600, #00ff66, #00ffff, #0066ff, #9900ff, #ff0055);
        animation: rotateRainbow 2.8s linear infinite;
        box-shadow:
          0 0 22px rgba(255, 0, 128, 0.5),
          0 0 35px rgba(0, 223, 216, 0.35);
        z-index: 1;
      }

      .intro-avatar {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        animation: spinIntro 5s linear infinite;
        border: 3px solid #08080e;
      }

      @keyframes rotateRainbow {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes spinIntro {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .intro-title {
        font-family: "Montserrat", sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        margin-bottom: 0;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        text-shadow:
          0 0 12px rgba(255, 255, 255, 0.7),
          0 0 25px rgba(255, 255, 255, 0.35),
          0 0 45px rgba(255, 255, 255, 0.2);
        animation: softGlow 3s ease-in-out infinite alternate;
      }

      .intro-cursor {
        display: inline-block;
        margin-left: 3px;
        color: #ffffff;
        font-weight: 300;
        font-size: 1.35rem;
        animation: blink 0.75s step-end infinite;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      @keyframes softGlow {
        0% {
          text-shadow:
            0 0 10px rgba(255, 255, 255, 0.6),
            0 0 20px rgba(255, 255, 255, 0.25);
          opacity: 0.9;
        }
        100% {
          text-shadow:
            0 0 18px rgba(255, 255, 255, 0.9),
            0 0 35px rgba(255, 255, 255, 0.5),
            0 0 50px rgba(255, 255, 255, 0.25);
          opacity: 1;
        }
      }

      .top-controls {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 1000;
        display: flex;
        align-items: center;
        pointer-events: none;
      }

      .top-btn {
        pointer-events: auto;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        position: relative;
        overflow: hidden;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.02) 60%,
          rgba(255, 255, 255, 0.06) 100%
        );
        backdrop-filter: blur(6px) saturate(180%);
        -webkit-backdrop-filter: blur(6px) saturate(180%);

        border: 1px solid rgba(255, 255, 255, 0.14);
        border-top: 1px solid rgba(255, 255, 255, 0.28);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.08),
          0 4px 16px rgba(0, 0, 0, 0.25);
      }

      .top-btn i {
        position: relative;
        z-index: 2;
      }

      .top-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
        border-radius: 50% 50% 100% 100% / 100% 100% 0 0;
        pointer-events: none;
        z-index: 1;
      }

    <script>
      (() => {
        const button = document.getElementById("heartCounter");
        const eyeButton = document.getElementById("visitorCounter");
        const number = document.getElementById("heartCounterNumber");
        const content = document.getElementById("heartCounterContent");
        const status = document.getElementById("heartCounterStatus");
        const effects = document.getElementById("heartEffects");
        const intro = document.getElementById("introScreen");
        const settings = document.getElementById("settingsModal");
        const avatarPreview = document.getElementById("avatarPreviewOverlay");
        const key = "ngochaovjppro-xyz-profile-hearts-20261028";
        const formatter = new Intl.NumberFormat("vi-VN");
        const heartPath =
          "M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5";
        const ignoredTargets =
          'a, button, input, textarea, select, label, [role="button"], .profile-counters, .mini-music-bar, .settings-modal, .game-modal-overlay, .avatar-preview-overlay, .top-controls, #avatarBox, #flyingPetsContainer, .intro-screen';
        let expanded = false;
        let confirmed = 0;
        let loaded = false;
        let unavailable = false;
        let pending = 0;
        let syncing = false;
        let tapCount = 0;
        let lastTapAt = -Infinity;
        let resetTimer;
        let initialLoad;
        const waitingHearts = new Map();
        function renderHearts() {
          const total = confirmed + pending;
          status.textContent = unavailable ? "—" : !loaded && pending === 0 ? "…" : formatter.format(total);
          button.setAttribute("aria-expanded", String(expanded));
          number.setAttribute("aria-hidden", String(!expanded));
          button.setAttribute(
            "aria-label",
            expanded
              ? unavailable
                ? "Số tim tạm thời không khả dụng. Bấm để thu gọn"
                : !loaded && pending === 0
                  ? "Đang tải số tim"
                  : formatter.format(total) + " tim. Bấm để thu gọn"
              : "Hiện tổng số tim",
          );
          number.style.width = expanded ? Math.ceil(content.getBoundingClientRect().width) + "px" : "0px";
        }
        async function requestHearts(action) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 1e4);
          try {
            const response = await fetch(
              "https://countapi.mileshilliard.com/api/v1/" + action + "/" + key + "?t=" + Date.now(),
              {
                cache: "no-store",
                credentials: "omit",
                referrerPolicy: "no-referrer",
                signal: controller.signal,
              },
            );
            if (action === "get" && response.status === 404) return 0;
            if (!response.ok) throw new Error("Heart counter unavailable");
            const data = await response.json();
            if (!Number.isSafeInteger(data.value) || data.value < 0) throw new Error("Invalid heart count");
            return data.value;
          } finally {
            clearTimeout(timer);
          }
        }
        async function syncHearts() {
          if (syncing) return;
          syncing = true;
          try {
            await initialLoad;
            while (pending > 0) {
              try {
                const value = await requestHearts("hit");
                confirmed = Math.max(confirmed, value);
                pending -= 1;
                loaded = true;
                unavailable = false;
              } catch (_) {
                pending = 0;
                unavailable = true;
              }
              renderHearts();
            }
          } finally {
            syncing = false;
          }
        }
        function bloomHeart(x, y) {
          const burst = document.createElement("span");
          burst.className = "heart-burst";
          burst.style.left = x + "px";
          burst.style.top = y + "px";
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const layers = [
            { x: -10, y: -12, size: 30, opacity: 0.2, duration: 660 },
            { x: -5, y: -6, size: 25, opacity: 0.28, duration: 560 },
            { x: 0, y: 0, size: 20, opacity: 0.8, duration: 460 },
          ];
          layers.forEach((config, index) => {
            const layer = document.createElement("span");
            const isEcho = index < 2;
            layer.className =
              "heart-burst-body" + (isEcho ? " neon-echo" : "") + (index === 0 ? " neon-echo-top" : "");
            layer.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' +
              heartPath +
              '"/></svg>';
            const endTransform = "translate(" + config.x + "px," + config.y + "px) scale(1)";
            layer.style.width = config.size + "px";
            layer.style.height = config.size + "px";
            layer.style.left = -config.size / 2 + "px";
            layer.style.top = -config.size / 2 + "px";
            layer.style.transform = endTransform;
            layer.style.opacity = String(config.opacity);
            burst.appendChild(layer);
            if (reduced) return;
            const frames = isEcho
              ? [
                  {
                    transform: "translate(" + config.x * 0.2 + "px," + config.y * 0.2 + "px) scale(.3)",
                    opacity: 0,
                  },
                  { transform: endTransform, opacity: config.opacity },
                ]
              : [
                  { transform: "scale(.08)", opacity: 0 },
                  { transform: "scale(1.08)", opacity: config.opacity, offset: 0.6 },
                  { transform: "scale(1)", opacity: config.opacity },
                ];
            layer.animate(frames, {
              duration: config.duration,
              easing: isEcho ? "cubic-bezier(.15,.7,.3,1)" : "linear",
              fill: "forwards",
            });
          });
          if (effects.children.length >= 24) {
            waitingHearts.delete(effects.firstElementChild);
            effects.firstElementChild.remove();
          }
          effects.appendChild(burst);
          waitingHearts.set(burst, { x, y });
        }
        function collectHearts() {
          if (waitingHearts.size === 0) return;
          const rect = button.querySelector(".visitor-counter-eye").getBoundingClientRect();
          const targetX = rect.left + rect.width / 2;
          const targetY = rect.top + rect.height / 2;
          for (const [burst, start] of waitingHearts) {
            const dx = targetX - start.x;
            const dy = targetY - start.y;
            burst.style.setProperty("--heart-dx", dx + "px");
            burst.style.setProperty("--heart-dy", dy + "px");
            burst.style.setProperty("--heart-mid-x", dx * 0.56 + "px");
            burst.style.setProperty("--heart-mid-y", dy * 0.32 - 24 + "px");
            burst.classList.add("is-collecting");
            setTimeout(() => burst.remove(), 700);
          }
          waitingHearts.clear();
          setTimeout(() => {
            if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              button.animate([{ transform: "scale(1)" }, { transform: "scale(1.14)" }, { transform: "scale(1)" }], { duration: 230, easing: "ease-out" });
            }
          }, 630);
        }
        function resetTaps() {
          clearTimeout(resetTimer);
          tapCount = 0;
          lastTapAt = -Infinity;
          collectHearts();
        }
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          expanded = !expanded;
          renderHearts();
        });
        button.addEventListener("keydown", (event) => {
          if (event.key === " " || event.key === "Enter") event.stopPropagation();
          if (event.key === "Escape") {
            expanded = false;
            renderHearts();
          }
        });
        if (intro && eyeButton) {
          intro.addEventListener(
            "click",
            () => {
              let played = false;
              const showHint = () => {
                if (played) return;
                played = true;
                eyeButton.classList.add("counter-intro-hint");
                setTimeout(() => eyeButton.classList.remove("counter-intro-hint"), 500);
              };
              const onTransitionEnd = (event) => {
                if (event.target !== intro || event.propertyName !== "opacity") return;
                intro.removeEventListener("transitionend", onTransitionEnd);
                clearTimeout(fallback);
                showHint();
              };
              intro.addEventListener("transitionend", onTransitionEnd);
              const fallback = setTimeout(() => {
                intro.removeEventListener("transitionend", onTransitionEnd);
                showHint();
              }, 850);
            },
            {
              once: true,
            },
          );
        }
        document.addEventListener(
          "click",
          (event) => {
            if (!event.isTrusted || event.detail === 0 || event.button !== 0) return;
            if (
              (intro && !intro.classList.contains("hide")) ||
              (settings && settings.classList.contains("active")) ||
              (avatarPreview && avatarPreview.classList.contains("active")) ||
              event.target.closest(ignoredTargets)
            ) {
              return;
            }
            const now = performance.now();
            if (now - lastTapAt >= 1e3) collectHearts();
            tapCount = now - lastTapAt <= 500 ? tapCount + 1 : 1;
            lastTapAt = now;
            clearTimeout(resetTimer);
            resetTimer = setTimeout(resetTaps, 1e3);
            if (tapCount < 2) return;
            pending += 1;
            unavailable = false;
            button.classList.add("has-liked");
            renderHearts();
            bloomHeart(event.clientX, event.clientY);
            void syncHearts();
          },
          {
            capture: true,
          },
        );
        renderHearts();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderHearts);
        initialLoad = requestHearts("get")
          .then((value) => {
            confirmed = Math.max(confirmed, value);
            loaded = true;
            if (!syncing) unavailable = false;
            renderHearts();
          })
          .catch(() => {
            if (!loaded && pending === 0) {
              unavailable = true;
              renderHearts();
            }
          });
      })();
    </script>

    <script>
      (() => {
        const counter = document.getElementById("visitorCounter");
        const number = document.getElementById("visitorCounterNumber");
        const content = document.getElementById("visitorCounterContent");
        const status = document.getElementById("visitorCounterStatus");
        let expanded = false;
        let unavailable = false;
        let total = null;
        function renderCounter() {

          counter.setAttribute(

            expanded

                  : status.textContent + " lượt xem. Bấm để thu gọn"

      function makeRangeSliderDraggable(slider, onInput) {
        if (!slider) return;
        function updateVal(clientX) {
          const rect = slider.getBoundingClientRect();
          if (rect.width <= 0) return;
          const min = parseFloat(slider.min) || 0;
          const max = parseFloat(slider.max) || 100;
          const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          const val = Math.round(min + ratio * (max - min));
          if (slider.value != val) {
            slider.value = val;
            onInput();
          }
        }
        slider.addEventListener("pointerdown", (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          window.isDraggingSlider = true;
          try {
            slider.setPointerCapture(e.pointerId);
          } catch (_) {}
          updateVal(e.clientX);
          e.preventDefault();
          e.stopPropagation();
          const onPointerMove = (evt) => {
            if (!window.isDraggingSlider) return;
            updateVal(evt.clientX);
          };
          const onPointerUp = (evt) => {
            window.isDraggingSlider = false;
            try {
              slider.releasePointerCapture(evt.pointerId);
            } catch (_) {}
            window.removeEventListener("pointermove", onPointerMove);
            window.removeEventListener("pointerup", onPointerUp);
            window.removeEventListener("pointercancel", onPointerUp);
            slider.removeEventListener("pointermove", onPointerMove);
            slider.removeEventListener("pointerup", onPointerUp);
            slider.removeEventListener("pointercancel", onPointerUp);
            updateVal(evt.clientX);
          };
          slider.addEventListener("pointermove", onPointerMove);
          slider.addEventListener("pointerup", onPointerUp);
          slider.addEventListener("pointercancel", onPointerUp);
          window.addEventListener("pointermove", onPointerMove);
          window.addEventListener("pointerup", onPointerUp);
          window.addEventListener("pointercancel", onPointerUp);
        });

      (function () {
        const canvas = document.getElementById("neonRibbonCanvas");
        if (!canvas) return;
        const mouseTrailEnabled = window.matchMedia("(hover: hover) and (pointer: fine) and (min-width: 769px)");
        if (!mouseTrailEnabled.matches) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);
        const history = [];
        const MAX_POINTS = 20;
        let frame = null;
        let hasPixels = false;
        const initialTheme = getComputedStyle(document.documentElement);
        let themeColor = initialTheme.getPropertyValue("--accent").trim() || "#f2eff0";
        let glowColor = initialTheme.getPropertyValue("--accent-glow").trim() || themeColor;
        window.addEventListener("theme-color-change", (event) => {
          themeColor = event.detail.color;
          glowColor = event.detail.glow;
          if (history.length > 0) scheduleDraw();
        });

        function scheduleDraw() {
          if (frame === null && !document.hidden) frame = requestAnimationFrame(drawRibbon);
        }
        function addPoint(x, y) {
          history.push({ x, y, age: 0 });
          if (history.length > MAX_POINTS) history.shift();
          scheduleDraw();
        }
        window.addEventListener("resize", () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          history.length = 0;
          hasPixels = false;
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
        });
        window.addEventListener("pointermove", (event) => {
          if (event.pointerType !== "mouse" || !mouseTrailEnabled.matches) return;
          addPoint(event.clientX, event.clientY);
        }, { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) return;
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
          history.length = 0;
          if (hasPixels) ctx.clearRect(0, 0, width, height);
          hasPixels = false;
        });
        function drawRibbon() {
          frame = null;
          if (document.hidden) return;
          if (history.length === 0) {
            if (hasPixels) ctx.clearRect(0, 0, width, height);
            hasPixels = false;
            return;
          }
          ctx.clearRect(0, 0, width, height);
          hasPixels = false;
          for (let i = history.length - 1; i >= 0; i--) {
            history[i].age++;
            if (history[i].age > MAX_POINTS) history.splice(i, 1);
          }
          if (history.length > 2) {
            hasPixels = true;
            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            for (let i = 1; i < history.length; i++) {
              const p1 = history[i - 1];
              const p2 = history[i];
              const progress = i / history.length;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = themeColor;
              ctx.shadowColor = glowColor;
              ctx.shadowBlur = progress * 16;
              ctx.lineWidth = progress * 7.5 + 1;
              ctx.globalAlpha = Math.pow(progress, 1.4);
              ctx.stroke();
            }
            ctx.shadowBlur = 0;
            for (let i = 1; i < history.length; i++) {
              const p1 = history[i - 1];
              const p2 = history[i];
              const progress = i / history.length;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = themeColor;
              ctx.lineWidth = progress * 2.2 + 0.5;
              ctx.globalAlpha = progress * 0.9;
              ctx.stroke();
            }
            ctx.restore();
          }
          if (history.length > 0) scheduleDraw();
        }
      })();

      function updatePreviewClock() {
        const el = document.getElementById("previewRealtime");
        if (!el) return;
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        const s = String(now.getSeconds()).padStart(2, "0");
        el.textContent = `${h}:${m}:${s}`;
      }

      setInterval(updatePreviewClock, 1e3);

      updatePreviewClock();
    </script>
  </body></html
